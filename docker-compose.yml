# Matches the pattern the other sites on this host use: a container on the
# shared `web` network, with Caddy reverse-proxying to it by name.
#
# The image builds the site itself, so the host needs only Docker.
services:
  portfolio:
    build: .
    image: portfolio:latest
    container_name: portfolio_app
    restart: unless-stopped
    networks:
      - web

networks:
  web:
    name: web
    external: true
