# Matches the pattern the other sites on this host use: a container on the
# shared `web` network, with Caddy reverse-proxying to it by name.
services:
  portfolio:
    image: nginx:alpine
    container_name: portfolio_app
    restart: unless-stopped
    volumes:
      - ./out:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - web

networks:
  web:
    name: web
    external: true
